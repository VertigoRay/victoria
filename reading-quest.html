<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Victoria's Narnia Reading Quest</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(#e8f5e9,#e1bee7);color:#321044}.wrap{max-width:720px;margin:auto;padding:24px}a{color:#6a1b9a}.hero,.card{background:#fff;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 8px 24px #6a1b9a22}.hero{text-align:center;background:linear-gradient(135deg,#fff,#f3e5f5)}h1{margin:.2em 0;color:#6a1b9a}.due{display:inline-block;background:#ad1457;color:#fff;padding:7px 13px;border-radius:999px;font-weight:800}.mission{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #eee}.mission:last-child{border:0}input[type=checkbox]{width:24px;height:24px;accent-color:#7b1fa2}.prompt{width:100%;min-height:72px;padding:10px;border:2px solid #ce93d8;border-radius:12px;font:inherit}button{background:#6a1b9a;color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.saved{color:#2e7d32;font-weight:700;margin-left:8px}small{color:#666}</style></head><body><main class="wrap"><a href="index.html">&larr; Learning Castle</a><section class="hero"><div style="font-size:3rem">&#x1F981; &#x1F6AA; &#x2744;&#xFE0F;</div><h1>Narnia Reading Quest</h1><p><strong><em>The Lion, the Witch and the Wardrobe</em></strong><br>C. S. Lewis &middot; HarperCollins &middot; ISBN 9780064404990</p><span class="due">Bring by Monday, August 31</span></section><section class="card"><h2>Before the wardrobe opens</h2><label class="mission"><input type="checkbox" data-save="book"><span><strong>Book ready</strong><br><small>Use the matching edition so class page numbers line up.</small></span></label><label class="mission"><input type="checkbox" data-save="cover"><span><strong>Cover detective</strong><br><small>List three clues the cover gives about the setting.</small></span></label><label class="mission"><input type="checkbox" data-save="words"><span><strong>Word scout</strong><br><small>Define wardrobe, prophecy, faun, and evacuee.</small></span></label></section><section class="card"><h2>Spoiler-free prediction</h2><p>If a wardrobe opened into another world, what would you pack and why?</p><textarea class="prompt" id="note" placeholder="Write your prediction here..."></textarea><p><button id="save">Save on this device</button><span class="saved" id="status" role="status" aria-live="polite"></span></p></section></main><script>
const key='victoria-narnia-quest-v1';const state=JSON.parse(localStorage.getItem(key)||'{}');document.querySelectorAll('[data-save]').forEach(x=>{x.checked=!!state[x.dataset.save];x.onchange=()=>{state[x.dataset.save]=x.checked;localStorage.setItem(key,JSON.stringify(state))}});note.value=state.note||'';save.onclick=()=>{state.note=note.value;localStorage.setItem(key,JSON.stringify(state));document.getElementById('status').textContent='Saved!'};
</script></body></html>
