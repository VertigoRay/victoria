<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Victoria's Poetry Castle</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Quicksand',sans-serif;min-height:100vh;background:#1a1a2e;color:#eee;overflow-x:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .screen{display:none;min-height:100vh;padding:16px}
    .screen.active{display:block}

    /* Map */
    .map-bg{background:linear-gradient(180deg,#0f0c29,#302b63 50%,#24243e)}
    .map-header{text-align:center;padding:24px 0 8px}
    .map-header h1{font-family:'Pacifico',cursive;font-size:1.8em;color:#ffd700;text-shadow:0 2px 10px rgba(255,215,0,.3)}
    .gems-display{font-size:1.1em;color:#e0e0e0;margin-top:8px}
    .castle-map{max-width:500px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:16px 0}
    .room-card{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.05));border:2px solid rgba(255,255,255,.15);border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .3s;-webkit-tap-highlight-color:transparent}
    .room-card:active{transform:scale(.97)}
    .room-card.locked{opacity:.4;cursor:default}
    .room-card.completed{border-color:#4caf50}
    .room-icon{font-size:2.2em;width:58px;height:58px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border-radius:14px;flex-shrink:0}
    .room-info h3{font-size:1.05em;font-weight:700;margin-bottom:3px}
    .room-info p{font-size:.8em;opacity:.7;line-height:1.3}
    .room-status{margin-left:auto;font-size:1.3em;flex-shrink:0}
    .study-btn{display:block;text-align:center;margin:16px auto;padding:14px 28px;background:linear-gradient(135deg,#4a148c,#7b1fa2);color:white;border:none;border-radius:12px;font-size:1em;font-weight:600;cursor:pointer;font-family:'Quicksand',sans-serif}

    /* Game chrome */
    .game-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
    .back-btn{background:rgba(255,255,255,.15);border:none;color:white;padding:10px 16px;border-radius:10px;font-size:.9em;cursor:pointer;font-family:'Quicksand',sans-serif;font-weight:600;min-height:44px}
    .game-title{font-family:'Pacifico',cursive;font-size:1.2em;color:#ffd700}
    .game-gems{margin-left:auto;font-size:.95em}
    .game-card{background:rgba(255,255,255,.08);border-radius:16px;padding:18px;margin-bottom:14px;max-width:500px;margin-left:auto;margin-right:auto}
    .game-card h3{font-size:1em;margin-bottom:10px;color:#ffd700}

    .progress-dots{display:flex;justify-content:center;gap:6px;margin:10px 0}
    .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2)}
    .dot.done{background:#4caf50}.dot.current{background:#ffd700;width:12px;height:12px}

    .check-btn{display:block;margin:12px auto;padding:14px 32px;background:linear-gradient(135deg,#ffd700,#ffab00);color:#333;border:none;border-radius:12px;font-size:1.05em;font-weight:700;cursor:pointer;font-family:'Quicksand',sans-serif;min-height:48px}
    .check-btn:disabled{opacity:.4}
    .next-btn{display:none;margin:8px auto;padding:12px 28px;background:linear-gradient(135deg,#7b1fa2,#9c27b0);color:white;border:none;border-radius:12px;font-size:1em;font-weight:600;cursor:pointer;font-family:'Quicksand',sans-serif;min-height:48px}
    .next-btn.show{display:block}
    .feedback{text-align:center;padding:14px;border-radius:12px;margin:12px auto;max-width:500px;font-weight:600;display:none}
    .feedback.show{display:block}
    .feedback.ok{background:rgba(76,175,80,.2);color:#81c784}
    .feedback.no{background:rgba(244,67,54,.2);color:#ef9a9a}
    .feedback .small{font-size:.8em;font-weight:400;opacity:.8;margin-top:4px}

    /* Syllable Kitchen */
    .kitchen-bg{background:linear-gradient(180deg,#1a0a2e,#2d1b4e,#1a0a2e)}
    .cauldron{text-align:center;margin:10px 0;font-size:3.5em;position:relative}
    .steam{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.4em;animation:steam 2s ease-in-out infinite}
    @keyframes steam{0%,100%{opacity:.3;transform:translateX(-50%) translateY(0)}50%{opacity:.8;transform:translateX(-50%) translateY(-10px)}}

    .syl-bar{display:flex;justify-content:center;gap:8px;margin:10px 0}
    .syl-box{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 14px;text-align:center;min-width:65px;border:2px solid transparent}
    .syl-box .n{font-size:1.5em;font-weight:700}
    .syl-box .t{font-size:.7em;opacity:.6}
    .syl-box.ok{background:rgba(76,175,80,.2);border-color:#4caf50}
    .syl-box.over{background:rgba(244,67,54,.2);border-color:#f44336}
    .syl-box.active{border-color:#ffd700}

    .haiku-display{margin:12px 0}
    .h-line{padding:8px 12px;margin:4px 0;border-radius:8px;background:rgba(255,255,255,.05);min-height:38px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-style:italic;color:#ccc}
    .h-line.cur{background:rgba(255,215,0,.08);border:1px dashed rgba(255,215,0,.4)}
    .h-word{background:rgba(156,39,176,.3);padding:3px 8px;border-radius:6px;font-style:normal;color:#e1bee7;font-size:.9em}

    .word-tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px}
    .chip{background:linear-gradient(135deg,#7b1fa2,#9c27b0);color:white;padding:10px 16px;border-radius:20px;cursor:pointer;font-size:.95em;font-weight:600;font-family:'Quicksand',sans-serif;user-select:none;transition:all .15s;min-height:44px;display:flex;align-items:center}
    .chip:active{transform:scale(.92)}
    .chip.used{opacity:.25;pointer-events:none}
    .undo{display:block;margin:8px auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:white;padding:10px 20px;border-radius:10px;cursor:pointer;font-family:'Quicksand',sans-serif;font-weight:600;min-height:44px}

    /* Rhyme Painter */
    .painter-bg{background:linear-gradient(180deg,#0d1b2a,#1b2838,#0d1b2a)}
    .palette{display:flex;justify-content:center;gap:10px;margin:14px 0;flex-wrap:wrap}
    .paint{width:52px;height:52px;border-radius:50%;cursor:pointer;border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1em;color:white;transition:all .2s}
    .paint:active{transform:scale(.9)}
    .paint.sel{border-color:white;transform:scale(1.12);box-shadow:0 0 20px rgba(255,255,255,.3)}
    .pa{background:#e91e63}.pb{background:#2196f3}.pc{background:#ff9800}.pe{background:rgba(255,255,255,.2);font-size:1.2em}

    .poem-lines{margin:12px 0}
    .p-line{padding:14px 16px;margin:6px 0;border-radius:10px;background:rgba(255,255,255,.08);cursor:pointer;display:flex;align-items:center;gap:12px;border-left:4px solid transparent;transition:all .2s;min-height:48px}
    .p-line:active{background:rgba(255,255,255,.15)}
    .lbl{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9em;flex-shrink:0;background:rgba(255,255,255,.15);transition:all .3s}
    .la{background:#e91e63!important;color:white}.lb{background:#2196f3!important;color:white}.lc{background:#ff9800!important;color:white}
    .ba{border-left-color:#e91e63}.bb{border-left-color:#2196f3}.bc{border-left-color:#ff9800}

    /* Study */
    .study-bg{background:linear-gradient(180deg,#1a0a2e,#2d1b4e)}
    .s-card{background:rgba(255,255,255,.08);border-radius:12px;padding:14px;margin-bottom:10px;max-width:500px;margin-left:auto;margin-right:auto}
    .s-card h3{color:#ffd700;margin-bottom:5px;font-size:1em}
    .s-card p{font-size:.88em;line-height:1.5;opacity:.9}
    .s-ex{font-style:italic;margin-top:6px;padding:8px;background:rgba(255,255,255,.05);border-radius:8px;font-size:.82em;white-space:pre-line;opacity:.8}
    .s-title{color:#e040fb;font-size:1.05em;font-weight:700;margin:18px auto 8px;max-width:500px}
    .s-title.elem{color:#ff9800}

    /* Completion */
    .complete-card{text-align:center}
    .complete-card .big{font-size:3em;margin:10px 0}
  </style>
</head>
<body>

<div class="screen map-bg active" id="s-map">
  <div class="map-header">
    <div style="font-size:2em">&#x1F3F0;</div>
    <h1>Victoria's Poetry Castle</h1>
    <div class="gems-display">&#x1F48E; <span id="gem-count">0</span> gems</div>
  </div>
  <div class="castle-map" id="room-list"></div>
  <button class="study-btn" onclick="go('study')">&#x1F4DA; Study Guide</button>
</div>

<div class="screen kitchen-bg" id="s-kitchen">
  <div class="game-bar">
    <button class="back-btn" onclick="go('map')">&#x2190; Castle</button>
    <div class="game-title">&#x1F9EA; Syllable Kitchen</div>
    <div class="game-gems">&#x1F48E; <span id="k-gems">0</span></div>
  </div>
  <div class="progress-dots" id="k-dots"></div>
  <div id="k-area"></div>
</div>

<div class="screen painter-bg" id="s-painter">
  <div class="game-bar">
    <button class="back-btn" onclick="go('map')">&#x2190; Castle</button>
    <div class="game-title">&#x1F3A8; Rhyme Painter</div>
    <div class="game-gems">&#x1F48E; <span id="p-gems">0</span></div>
  </div>
  <div class="progress-dots" id="p-dots"></div>
  <div id="p-area"></div>
</div>

<div class="screen study-bg" id="s-study">
  <div class="game-bar">
    <button class="back-btn" onclick="go('map')">&#x2190; Castle</button>
    <div class="game-title">&#x1F4DA; Study Guide</div>
  </div>
  <div id="study-body"></div>
</div>

<script>
// ===== SYLLABLE HELPER =====
const SYL={the:1,a:1,an:1,old:1,new:1,big:1,red:1,blue:1,green:1,bright:1,dark:1,cold:1,warm:1,soft:1,loud:1,still:1,calm:1,deep:1,high:1,moon:1,sun:1,star:1,rain:1,snow:1,wind:1,leaf:1,tree:1,pond:1,frog:1,bird:1,sky:1,night:1,day:1,light:1,spring:1,falls:1,jumps:1,glows:1,shines:1,melts:1,drifts:1,sleeps:1,wakes:1,sings:1,flies:1,blooms:1,splash:1,crash:1,dream:1,clouds:1,breeze:1,trees:1,leaves:1,peace:1,waves:1,dance:1,white:1,black:1,frost:1,lake:1,stream:1,stones:1,wings:1,cool:1,
silent:2,gentle:2,golden:2,silver:2,dancing:2,falling:2,floating:2,glowing:2,shining:2,sleeping:2,waking:2,singing:2,flying:2,blooming:2,morning:2,evening:2,sunset:2,moonlight:2,starlight:2,dewdrop:2,rainbow:2,river:2,flower:2,garden:2,mountain:2,ocean:2,whisper:2,softly:2,slowly:2,quickly:2,gently:2,above:2,below:2,again:2,into:2,silence:2,ripple:2,cricket:2,covers:2,frozen:2,petals:2,summer:2,winter:2,autumn:2,wander:2,swaying:2,resting:2,
beautiful:3,waterfall:3,butterfly:3,dragonfly:3,tenderly:3,silently:3,quietly:3,magical:3,wonderful:3,sparkling:3,hovering:3,whispering:3,evergreen:3,memories:3,firefly:3,snowflakes:2,};
function syl(w){const k=w.toLowerCase().replace(/[^a-z]/g,'');if(SYL[k]!==undefined)return SYL[k];let c=0,pv=false;for(let i=0;i<k.length;i++){const v='aeiouy'.includes(k[i]);if(v&&!pv)c++;pv=v}if(k.endsWith('e')&&c>1)c--;return Math.max(1,c)}
function lineSyl(words){return words.reduce((s,w)=>s+syl(w),0)}

// ===== DATA =====
const HAIKUS=[
  {words:["an","old","silent","pond","a","frog","jumps","into","the","splash","silence","again","soft","moonlight","on"]},
  {words:["golden","sun","melts","soft","morning","light","drifts","gently","through","the","trees","birds","sing","above","spring"]},
  {words:["snowflakes","fall","soft","cold","winter","wind","white","covers","frozen","lake","a","still","deep","silence","sleeps"]},
  {words:["butterfly","floats","on","gentle","breeze","dancing","through","the","garden","blooms","bright","petals","wave","in","spring"]},
];

const RHYMES=[
  {title:"AABB",lines:["The cat sat on the mat so fat,","And wore upon his head a hat.","The dog ran down the street so fast,","The race was over, he came last."],key:["A","A","B","B"],hint:"Lines that END with the same sound get the same color!"},
  {title:"ABAB",lines:["Roses are red,","Violets are blue,","Sugar is sweet,","And so are you."],key:["A","B","A","B"],hint:"Every OTHER line rhymes. Try alternating colors!"},
  {title:"ABAB",lines:["The stars are shining in the night,","The moon is full and round,","They fill the sky with silver light,","And sparkle all around."],key:["A","B","A","B"],hint:"night/light rhyme. round/around rhyme."},
  {title:"AABB",lines:["I like to run and jump and play,","I do it almost every day.","I love to swim and splash around,","And roll upon the grassy ground."],key:["A","A","B","B"],hint:"First two lines rhyme together, then the next two."},
  {title:"ABCB",lines:["I went walking yesterday,","To see what I could find,","I found a little hidden bay,","And left the world behind."],key:["A","B","A","B"],hint:"yesterday/bay rhyme. find/behind rhyme."},
];

const STUDY_TYPES=[
  {n:"Acrostic",r:"The first letters of each line spell out a word or phrase.",e:"An acrostic poem\nCan be about anything\nReally\nOf course, some people like to\nStart each line as a sentence"},
  {n:"Haiku",r:"Three unrhymed lines. Syllable pattern: 5-7-5. Based on traditional Japanese poetry.",e:"An old silent pond\nA frog jumps into the pond\nSplash! Silence again"},
  {n:"Diamante",r:"Seven lines in a diamond shape. Line 1 & 7: nouns (opposites). Lines 2 & 6: adjectives. Lines 3 & 5: verbs. Line 4: four nouns.",e:"Day\nBright, Warm\nShining, Glowing, Radiating\nDay, Light, Energy, Hope\nSetting, Dimming, Fading\nCalm, Peaceful\nNight"},
  {n:"Cinquain",r:"Five lines. Syllable pattern: 2-4-6-8-2. Tells a story. Doesn't need to rhyme."},
  {n:"Limerick",r:"Humorous. 5 lines, 13 beats. AABBA rhyme scheme. Lines 1,2,5: 7-9 syllables. Lines 3,4: 5-7 syllables.",e:"A lim'rick's not hard to define\nBut it needs to do more than just rhyme\nIt's the meter that matters\nThe pitters and patters\nIf not, you're just wasting my time."},
  {n:"Couplet",r:"A pair of lines that rhyme. Can be a whole poem or part of one.",e:"The artist stirred some blue and green\nTo paint an underwater scene."},
  {n:"Sonnet",r:"14 lines, 10 syllables each. Three quatrains (ABAB rhyme) + final couplet (AA). First line = theme, couplet = conclusion."},
  {n:"Free Verse",r:"No rules! No required rhyme, meter, or line count. The poet creates beauty without guidelines.",e:"Up. Up.\nClick, click.\nWind blows\nsharp in my ears.\nMy heart jumps. Skips."},
];
const STUDY_ELEM=[
  {n:"Rhyme Scheme",d:"The pattern of rhyming lines. AABB = first two lines rhyme, next two rhyme. ABAB = every other line rhymes.",e:"Roses are red, (A)\nViolets are blue, (B)\nSugar is sweet, (A)\nAnd so are you. (B) = ABAB"},
  {n:"Imagery",d:"Words that help you picture something using your senses: see, hear, feel, smell, taste.",e:"\"Feathered wings\" - you imagine soft bird wings.\n\"The crackling fire warmed her icy fingers\""},
  {n:"Repetition",d:"Repeating words or phrases to make ideas stronger or create rhythm.",e:"\"Stop, stop, stop!\" - repeating makes it more urgent."},
  {n:"Theme",d:"The lesson or message of the poem. The big idea the poet wants you to understand.",e:"\"Nobody is perfect\" - a poem about making mistakes might have this theme."},
];

// ===== STATE =====
let G={gems:0,rooms:{},k:{round:0,gems:0,lines:[[],[],[]],cur:0},p:{round:0,gems:0,colors:[],sel:'A'}};
function load(){try{const d=JSON.parse(localStorage.getItem('vpc2')||'{}');if(d.gems!==undefined)G.gems=d.gems;if(d.rooms)G.rooms=d.rooms}catch(e){}}
function save(){localStorage.setItem('vpc2',JSON.stringify({gems:G.gems,rooms:G.rooms}))}
load();

const ROOMS=[
  {id:'kitchen',name:'Syllable Kitchen',icon:'\uD83E\uDDEA',desc:'Brew haiku poems with the perfect syllable count!',open:true},
  {id:'painter',name:'Rhyme Painter',icon:'\uD83C\uDFA8',desc:'Paint rhyme scheme patterns on poems!',open:true},
  {id:'detective',name:'Imagery Detective',icon:'\uD83D\uDD0D',desc:'Find imagery hiding in poems!',open:false},
  {id:'forge',name:'Diamond Forge',icon:'\u2666\uFE0F',desc:'Build diamante poems word by word!',open:false},
  {id:'dragon',name:'Poetry Dragon',icon:'\uD83D\uDC09',desc:'Battle the dragon with poetry knowledge!',open:false},
];

// ===== NAV =====
function go(screen){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  if(screen==='map'){document.getElementById('s-map').classList.add('active');renderMap()}
  else if(screen==='kitchen'){document.getElementById('s-kitchen').classList.add('active');initK()}
  else if(screen==='painter'){document.getElementById('s-painter').classList.add('active');initP()}
  else if(screen==='study'){document.getElementById('s-study').classList.add('active');renderStudy()}
}

function renderMap(){
  document.getElementById('gem-count').textContent=G.gems;
  const el=document.getElementById('room-list');
  el.innerHTML='';
  for(const r of ROOMS){
    const done=G.rooms[r.id]?.done;
    const locked=!r.open&&!done;
    const d=document.createElement('div');
    d.className='room-card'+(locked?' locked':'')+(done?' completed':'');
    d.innerHTML=`<div class="room-icon">${r.icon}</div><div class="room-info"><h3>${r.name}</h3><p>${locked?'\uD83D\uDD12 Coming soon!':r.desc}</p></div><div class="room-status">${done?'\u2705':locked?'\uD83D\uDD12':'\u27A1\uFE0F'}</div>`;
    if(!locked)d.onclick=()=>go(r.id);
    el.appendChild(d);
  }
}

// ===== KITCHEN =====
function initK(){G.k={round:0,gems:0,lines:[[],[],[]],cur:0};document.getElementById('k-gems').textContent='0';renderK()}

function renderK(){
  const k=G.k, h=HAIKUS[k.round%HAIKUS.length];
  k.lines=[[],[],[]];k.cur=0;
  const dots=document.getElementById('k-dots');
  dots.innerHTML='';
  for(let i=0;i<HAIKUS.length;i++){const d=document.createElement('span');d.className='dot'+(i<k.round?' done':'')+(i===k.round?' current':'');dots.appendChild(d)}
  const words=[...h.words].sort(()=>Math.random()-.5);
  document.getElementById('k-area').innerHTML=`
    <div class="game-card">
      <h3>&#x1F375; Brew a Haiku!</h3>
      <p style="font-size:.82em;opacity:.6;margin-bottom:6px">Tap words to build each line. Hit 5 - 7 - 5 syllables!</p>
      <div class="cauldron">&#x1F9EA;<span class="steam">&#x2728;&#x2728;&#x2728;</span></div>
      <div class="syl-bar">${[0,1,2].map(i=>`<div class="syl-box${i===0?' active':''}" id="sb${i}"><div class="n">0</div><div class="t">/ ${[5,7,5][i]}</div></div>`).join('')}</div>
      <div class="haiku-display">${[0,1,2].map(i=>`<div class="h-line${i===0?' cur':''}" id="hl${i}">Line ${i+1}...</div>`).join('')}</div>
      <div class="word-tray" id="wtray">${words.map((w,i)=>`<span class="chip" data-w="${w}" data-i="${i}" onclick="tapWord(this)">${w}</span>`).join('')}</div>
      <button class="undo" onclick="undoK()">&#x21A9; Undo</button>
    </div>
    <button class="check-btn" id="k-check" onclick="checkK()" disabled>&#x2728; Check My Haiku!</button>
    <div class="feedback" id="k-fb"></div>
    <button class="next-btn" id="k-next" onclick="nextK()">Next Poem &#x2192;</button>`;
}

function tapWord(chip){
  const k=G.k;if(k.cur>2)return;
  k.lines[k.cur].push(chip.dataset.w);
  chip.classList.add('used');
  updK();
  if(lineSyl(k.lines[k.cur])>=[5,7,5][k.cur]){k.cur++;updK();if(k.cur>2)document.getElementById('k-check').disabled=false}
}

function undoK(){
  const k=G.k;
  if(k.lines[k.cur]?.length===0&&k.cur>0)k.cur--;
  if(k.lines[k.cur]?.length>0){
    const w=k.lines[k.cur].pop();
    document.querySelectorAll('.chip').forEach(c=>{if(c.dataset.w===w&&c.classList.contains('used')){c.classList.remove('used');return}});
    document.getElementById('k-check').disabled=true;updK()
  }
}

function updK(){
  const k=G.k,tgt=[5,7,5];
  for(let i=0;i<3;i++){
    const el=document.getElementById('hl'+i),sb=document.getElementById('sb'+i);
    const ws=k.lines[i],s=lineSyl(ws);
    el.innerHTML=ws.length?ws.map(w=>`<span class="h-word">${w}</span>`).join(''):`Line ${i+1}...`;
    el.className='h-line'+(i===k.cur?' cur':'');
    sb.querySelector('.n').textContent=s;
    sb.className='syl-box'+(s===tgt[i]?' ok':'')+(s>tgt[i]?' over':'')+(i===k.cur?' active':'');
  }
}

function checkK(){
  const k=G.k,fb=document.getElementById('k-fb'),tgt=[5,7,5];
  const counts=[0,1,2].map(i=>lineSyl(k.lines[i]));
  if(counts[0]===5&&counts[1]===7&&counts[2]===5){
    k.gems+=5;G.gems+=5;save();
    document.getElementById('k-gems').textContent=k.gems;
    fb.className='feedback show ok';
    fb.innerHTML=`<div>&#x2728; Perfect Haiku! +5 gems!</div><div class="small">${k.lines.map(l=>l.join(' ')).join(' / ')}</div>`;
    document.getElementById('k-check').disabled=true;
    document.getElementById('k-next').classList.add('show');
  }else{
    fb.className='feedback show no';
    fb.innerHTML=`<div>Not quite! Your syllables: ${counts.join(' - ')}</div><div class="small">Target is 5 - 7 - 5. Try again!</div>`;
    setTimeout(()=>{fb.className='feedback';renderK()},2500);
  }
}

function nextK(){
  G.k.round++;
  document.getElementById('k-next').classList.remove('show');
  document.getElementById('k-fb').className='feedback';
  if(G.k.round>=HAIKUS.length){
    G.rooms.kitchen={done:true};save();
    document.getElementById('k-area').innerHTML=`<div class="game-card complete-card"><div class="big">&#x1F389;</div><h3>Kitchen Complete!</h3><p>You earned &#x1F48E; ${G.k.gems} gems!</p><button class="check-btn" onclick="go('map')" style="margin-top:14px">&#x1F3F0; Back to Castle</button></div>`;
    return;
  }
  renderK();
}

// ===== PAINTER =====
function initP(){G.p={round:0,gems:0,colors:[],sel:'A'};document.getElementById('p-gems').textContent='0';renderP()}

function renderP(){
  const p=G.p,poem=RHYMES[p.round%RHYMES.length];
  p.colors=poem.lines.map(()=>null);p.sel='A';
  const dots=document.getElementById('p-dots');
  dots.innerHTML='';
  for(let i=0;i<RHYMES.length;i++){const d=document.createElement('span');d.className='dot'+(i<p.round?' done':'')+(i===p.round?' current':'');dots.appendChild(d)}
  document.getElementById('p-area').innerHTML=`
    <div class="game-card">
      <h3>&#x1F3A8; Paint the Rhyme Scheme!</h3>
      <p style="font-size:.82em;opacity:.5;margin-bottom:4px">${poem.title}</p>
      <p style="font-size:.8em;opacity:.5;margin-bottom:10px">${poem.hint}</p>
      <p style="font-size:.82em;opacity:.6;margin-bottom:10px">Pick a color, then tap lines that rhyme together. Same color = same sound!</p>
      <div class="palette">
        <div class="paint pa sel" onclick="selC('A')">A</div>
        <div class="paint pb" onclick="selC('B')">B</div>
        <div class="paint pc" onclick="selC('C')">C</div>
        <div class="paint pe" onclick="selC('X')">&#x232B;</div>
      </div>
      <div class="poem-lines">${poem.lines.map((l,i)=>`<div class="p-line" onclick="paintL(${i})"><span class="lbl" id="lb${i}">?</span><span>${l}</span></div>`).join('')}</div>
    </div>
    <button class="check-btn" id="p-check" onclick="checkP()">&#x2728; Check My Colors!</button>
    <div class="feedback" id="p-fb"></div>
    <button class="next-btn" id="p-next" onclick="nextP()">Next Poem &#x2192;</button>`;
}

function selC(c){
  G.p.sel=c;
  document.querySelectorAll('.paint').forEach(p=>p.classList.remove('sel'));
  const cls={A:'.pa',B:'.pb',C:'.pc',X:'.pe'};
  document.querySelector(cls[c])?.classList.add('sel');
}

function paintL(i){
  const p=G.p,c=p.sel;
  p.colors[i]=c==='X'?null:c;
  const lb=document.getElementById('lb'+i),ln=lb.closest('.p-line');
  lb.className='lbl';ln.className='p-line';
  if(p.colors[i]){const x=p.colors[i].toLowerCase();lb.classList.add('l'+x);lb.textContent=p.colors[i];ln.classList.add('b'+x)}
  else{lb.textContent='?'}
}

function normP(arr){const m={};let n=0;return arr.map(c=>{if(!(c in m))m[c]=n++;return m[c]}).join(',')}

function checkP(){
  const p=G.p,poem=RHYMES[p.round%RHYMES.length],fb=document.getElementById('p-fb');
  if(p.colors.some(c=>c===null)){fb.className='feedback show no';fb.innerHTML='<div>Paint all lines first!</div>';setTimeout(()=>fb.className='feedback',1500);return}
  if(normP(p.colors)===normP(poem.key)){
    p.gems+=3;G.gems+=3;save();
    document.getElementById('p-gems').textContent=p.gems;
    fb.className='feedback show ok';
    fb.innerHTML=`<div>&#x1F3A8; Perfect! It's ${poem.key.join('')}! +3 gems!</div>`;
    document.getElementById('p-check').disabled=true;
    document.getElementById('p-next').classList.add('show');
  }else{
    fb.className='feedback show no';
    fb.innerHTML=`<div>Not quite!</div><div class="small">Lines with the same ending sound should be the same color. Listen to the last word of each line!</div>`;
    setTimeout(()=>fb.className='feedback',3000);
  }
}

function nextP(){
  G.p.round++;
  document.getElementById('p-next').classList.remove('show');
  document.getElementById('p-fb').className='feedback';
  if(G.p.round>=RHYMES.length){
    G.rooms.painter={done:true};save();
    document.getElementById('p-area').innerHTML=`<div class="game-card complete-card"><div class="big">&#x1F308;</div><h3>Painting Complete!</h3><p>You earned &#x1F48E; ${G.p.gems} gems!</p><button class="check-btn" onclick="go('map')" style="margin-top:14px">&#x1F3F0; Back to Castle</button></div>`;
    return;
  }
  renderP();
}

// ===== STUDY =====
function renderStudy(){
  let h='<div class="s-title">&#x1F4DD; Poetry Types</div>';
  for(const t of STUDY_TYPES)h+=`<div class="s-card"><h3>${t.n}</h3><p>${t.r}</p>${t.e?`<div class="s-ex">${t.e}</div>`:''}</div>`;
  h+='<div class="s-title elem">&#x2728; Poetry Elements</div>';
  for(const e of STUDY_ELEM)h+=`<div class="s-card" style="border-left:3px solid #ff9800"><h3 style="color:#ff9800">${e.n}</h3><p>${e.d}</p><div class="s-ex">${e.e}</div></div>`;
  document.getElementById('study-body').innerHTML=h;
}

renderMap();
